<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Blue top half -->
  <rect width="900" height="300" fill="#0038A8"/>
  <!-- Red bottom half -->
  <rect y="300" width="900" height="300" fill="#CE1126"/>
  <!-- White triangle on left -->
  <polygon points="0,0 300,300 0,600" fill="#fff"/>
  <!-- Gold sun in triangle -->
  <circle cx="130" cy="300" r="55" fill="#FCD116"/>
  <!-- 8 sun rays -->
  <g stroke="#FCD116" stroke-width="8" stroke-linecap="round">
    <line x1="130" y1="225" x2="130" y2="200"/>
    <line x1="130" y1="375" x2="130" y2="400"/>
    <line x1="55"  y1="300" x2="30"  y2="300"/>
    <line x1="205" y1="300" x2="230" y2="300"/>
    <line x1="81"  y1="251" x2="64"  y2="234"/>
    <line x1="179" y1="349" x2="196" y2="366"/>
    <line x1="81"  y1="349" x2="64"  y2="366"/>
    <line x1="179" y1="251" x2="196" y2="234"/>
  </g>
</svg>
