<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- Blue field -->
  <rect width="60" height="30" fill="#012169"/>
  <!-- White diagonal cross (St Andrew) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
  <!-- Red diagonal cross (St Patrick) over white -->
  <path d="M0,0 L60,30" stroke="#C8102E" stroke-width="4"/>
  <path d="M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
  <!-- White St George cross -->
  <rect x="25" width="10" height="30" fill="#fff"/>
  <rect y="12" width="60" height="6" fill="#fff"/>
  <!-- Red St George cross -->
  <rect x="27" width="6" height="30" fill="#C8102E"/>
  <rect y="13" width="60" height="4" fill="#C8102E"/>
</svg>
